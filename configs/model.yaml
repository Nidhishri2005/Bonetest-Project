# Target Architecture & Modern Training Hyperparameters
architecture:
  backbone: "efficientnet_b3"
  pretrained: true
  input_size: 384
  in_channels: 3  # Grayscale replicated to 3 channels for ImageNet features
  sex_embedding_dim: 32  # 32-d embedding fused before MLP head
  mlp_hidden_dims: [256, 64]
  dropout: 0.3
  ensemble_size: 3

preprocessing:
  roi_crop: true
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  target_size: 384

target_standardization:
  enabled: true
  # Computed on training split in Phase 2
  mean_age: 127.32
  std_age: 41.18

training:
  loss: "huber"
  huber_delta: 1.0
  optimizer: "adamw"
  weight_decay: 1.0e-4
  learning_rate: 3.0e-4
  min_lr: 1.0e-6
  warmup_epochs: 3
  epochs: 35
  batch_size: 16
  scheduler: "cosine"
  early_stopping_patience: 7
  seed: 42
  seeds: [42, 1337, 2026]  # Seeds for 3-member ensemble
